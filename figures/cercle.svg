<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-hidden="true"><title>Les deux pieds entièrement dans le cercle jusqu'à ce que la boule touche le sol</title><style>.part{animation:part 1.2s 0.5s ease-out both}@keyframes part{0%{transform:translate(0px,320px)}100%{transform:translate(0px,0px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1000" height="1000" fill="#F2EADA"/><circle cx="500.0" cy="500.0" r="372.4" fill="none" stroke="#092C64" stroke-width="55.2"/><g transform="rotate(-8 420 500)"><rect x="378" y="360" width="84" height="280" rx="42" fill="#092C64" opacity=".92"/></g><g transform="rotate(8 580 500)"><rect x="538" y="360" width="84" height="280" rx="42" fill="#092C64" opacity=".92"/></g><line x1="100.0" y1="940.0" x2="900.0" y2="940.0" stroke="#B08A48" stroke-width="3" stroke-linecap="round"/><line x1="100.0" y1="930.0" x2="100.0" y2="950.0" stroke="#B08A48" stroke-width="3" stroke-linecap="round"/><line x1="900.0" y1="930.0" x2="900.0" y2="950.0" stroke="#B08A48" stroke-width="3" stroke-linecap="round"/><text x="500" y="930" text-anchor="middle" font-family="Jost, sans-serif" font-size="34" font-weight="500" fill="#B08A48">50 cm</text><g class="part"><circle cx="500.0" cy="90.0" r="36.5" fill="#FBF6EC"/><circle cx="500.0" cy="90.0" r="34.0" fill="#DD142E"/></g></svg>
