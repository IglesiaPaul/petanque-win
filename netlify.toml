# Site statique : rien à construire, on publie le dossier tel quel.
[build]
  publish = "."
  command = ""

# Une seule origine, et une seule. Une application installée depuis l'adresse Netlify et une
# installée depuis le domaine sont deux applications différentes pour le navigateur : deux
# icônes, deux caches, et surtout deux historiques de parties qui ne se voient pas. Le motif
# ne vise que le sous-domaine de production — les previews de branche, en
# « <branche>--petanque-win.netlify.app », continuent de répondre chez elles.
[[redirects]]
  from = "https://petanque-win.netlify.app/*"
  to = "https://petanque.win/:splat"
  status = 301
  force = true

# Le service worker et la page ne doivent jamais venir du cache du navigateur : sinon une
# nouvelle version ne s'installe pas et les téléphones gardent l'ancienne pendant des semaines.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Les pages de contenu et les pages d'entrée par langue changent à chaque mise en ligne et ne
# portent pas de version dans leur nom : le navigateur revalide à chaque fois. « Content-Language »
# dit la langue d'un dossier avant même que la page soit lue.
[[headers]]
  for = "/jouer.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/confidentialite.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/conditions.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/mentions-legales.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/en/*"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Language = "en"

[[headers]]
  for = "/th/*"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Language = "th"

# Android ne lit assetlinks.json que servi en « application/json », sans redirection. Netlify
# le déduit de l'extension, mais la vérification échoue en silence si jamais il s'en écarte :
# autant le dire. Sans cache, parce que l'empreinte de la clé de Google s'y ajoute après la
# première mise en ligne et doit être visible tout de suite.
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "no-cache"

# Polices et icônes portent leur version dans le cache du service worker : le navigateur
# peut les garder longtemps.
[[headers]]
  for = "/type/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# La page ne sort que vers un seul hôte, et la politique le nomme. « connect-src » est ouvert
# pour le projet Supabase et pour lui seul : tout autre appel réseau est refusé par le
# navigateur, y compris un appel qu'un code fautif introduirait par accident.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://wcivitpxrzggasxauckp.supabase.co; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
